[build-system]
requires = ["setuptools>=68", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-task-platform"
dynamic = ["version"]
description = "A durable, task/run-oriented platform for building and operating production AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "google-genai>=2.17.0",
  "httpx>=0.27",
  "jsonschema>=4",
  "pydantic>=2",
  "pydantic-settings>=2.2",
  "psycopg2-binary>=2.9",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "packaging>=24",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "testcontainers[postgres]>=4",
]
mcp = [
  "mcp>=1.19",
]
openai = [
  "openai>=2.36",
  "openai-agents>=0.17",
]

[project.scripts]
agent-task-platform = "interfaces.cli.main:main"
agent-task-platform-worker = "interfaces.cli.main:worker_main"

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "interfaces*", "orchestration*", "framework*", "agent_hub*", "plugins*", "infra*"]
exclude = ["tests*", "config*", "docs*", "var*"]

[tool.setuptools.package-data]
"interfaces.http" = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]
"plugins.skills" = ["**/*.md", "**/*.yaml", "**/*.json", "**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_llm: tests that call an external OpenAI-compatible Chat Completions endpoint",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B017", "B904"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["agent_hub", "domain", "framework", "infra", "interfaces", "orchestration", "plugins"]

[tool.coverage.report]
show_missing = true
skip_covered = true
